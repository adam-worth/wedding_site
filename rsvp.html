<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RSVP</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0f14; color: #e2e8f0; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 24px; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

      .card {
        border: 2px solid rgba(148,163,184,.25);
        border-radius: 14px;
        padding: 18px;
        background: rgba(2,6,23,.55);
        box-shadow: 0 18px 60px rgba(0,0,0,.45);
      }

      .header { padding: 0; overflow: hidden; margin-bottom: 14px; }
      .header img {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      label { display:block; margin: 12px 0 6px; color: #cbd5e1; }
      input, select, textarea {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid rgba(148,163,184,.25);
        background: rgba(2,6,23,.65);
        color: #e2e8f0;
        box-sizing: border-box;
        font: inherit;
      }
      textarea { min-height: 90px; resize: vertical; }

      button {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid rgba(226,232,240,.35);
        background: rgba(2,6,23,.85);
        color: #e2e8f0;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: .04em;
      }
      button:hover { border-color: rgba(226,232,240,.6); }
      .small { color:#94a3b8; font-size: 12px; margin-top: 10px; }

      .section {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(148,163,184,.18);
      }
      .section:first-of-type {
        margin-top: 10px;
        padding-top: 0;
        border-top: 0;
      }
      .section-title {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: rgba(226,232,240,.92);
      }
      .section-subtitle {
        margin: 0 0 10px;
        color: rgba(148,163,184,.95);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card header">
        <img src="./wedding_rsvp_header.jpg" alt="Dora and Jordan — Wedding RSVP" />
      </div>

      <div class="card">
        <h1 style="margin:0 0 6px;" data-i18n="heading_rsvp">RSVP</h1>
        <div class="small" data-i18n="subheading_date">
          August 15 • Festetics Palace • Budapest, Hungary 🏰
        </div>

        <form action="https://formspree.io/f/mblnwpqo" method="POST">
          <!-- Shared contact info once -->
          <label for="name" data-i18n="label_name">Name</label>
          <input id="name" name="name" autocomplete="name" required />

          <label for="email" data-i18n="label_email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <!-- HUNGARY SECTION -->
          <div class="section" aria-label="Hungary RSVP section">
            <div class="section-title" data-i18n="section_hungary_title">Hungary</div>
            <div class="section-subtitle" data-i18n="section_hungary_subtitle">Budapest • Festetics Palace • August 15</div>

            <label for="hungary_attendance" data-i18n="label_hungary_attendance">Will you attend the wedding in Hungary?</label>
            <select id="hungary_attendance" name="hungary_attendance" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="Yes" data-i18n="opt_yes">Yes</option>
              <option value="Maybe" data-i18n="opt_maybe">Maybe</option>
              <option value="No" data-i18n="opt_no">No</option>
            </select>

            <label for="hungary_guests" data-i18n="label_guests">Number of guests</label>
            <select id="hungary_guests" name="hungary_guests" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>

            <label for="hungary_guest_names" data-i18n="label_guest_names">Guest names</label>
            <textarea
              id="hungary_guest_names"
              name="hungary_guest_names"
              data-i18n-placeholder="ph_guest_names"
              placeholder="Please list all attending guests (including yourself), one per line."
            ></textarea>

            <label for="hungary_hotel" data-i18n="label_hotel">Interested in hotel accommodation?</label>
            <select id="hungary_hotel" name="hungary_hotel_accommodation_interest" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="Yes" data-i18n="opt_yes">Yes</option>
              <option value="No" data-i18n="opt_no">No</option>
            </select>

            <label for="hungary_diet" data-i18n="label_diet">Food allergies or dietary preferences</label>
            <textarea
              id="hungary_diet"
              name="hungary_food_allergies_preferences"
              data-i18n-placeholder="ph_diet"
              placeholder="e.g., vegetarian, vegan, gluten-free, nut allergy, etc."
            ></textarea>

            <label for="hungary_song" data-i18n="label_song">One must-play wedding song</label>
            <input
              id="hungary_song"
              name="hungary_must_play_song"
              data-i18n-placeholder="ph_song"
              placeholder="Artist — Song title"
              autocomplete="off"
            />
          </div>

          <!-- WISCONSIN SECTION -->
          <div class="section" aria-label="Wisconsin RSVP section">
            <div class="section-title" data-i18n="section_wisconsin_title">Wisconsin</div>
            <div class="section-subtitle" data-i18n="section_wisconsin_subtitle">Party • Date TBD</div>

            <label for="wisconsin_attendance" data-i18n="label_wisconsin_attendance">Will you attend the Wisconsin party? (date TBD)</label>
            <select id="wisconsin_attendance" name="wisconsin_attendance" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="Yes" data-i18n="opt_yes">Yes</option>
              <option value="Maybe" data-i18n="opt_maybe">Maybe</option>
              <option value="No" data-i18n="opt_no">No</option>
            </select>

            <label for="wisconsin_guests" data-i18n="label_guests">Number of guests</label>
            <select id="wisconsin_guests" name="wisconsin_guests" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>

            <label for="wisconsin_guest_names" data-i18n="label_guest_names">Guest names</label>
            <textarea
              id="wisconsin_guest_names"
              name="wisconsin_guest_names"
              data-i18n-placeholder="ph_guest_names"
              placeholder="Please list all attending guests (including yourself), one per line."
            ></textarea>

            <!-- Same question set, even if hotel may not apply; keep for parity as requested -->
            <label for="wisconsin_hotel" data-i18n="label_hotel">Interested in hotel accommodation?</label>
            <select id="wisconsin_hotel" name="wisconsin_hotel_accommodation_interest" required>
              <option value="" selected disabled data-i18n="opt_select_one">Select one…</option>
              <option value="Yes" data-i18n="opt_yes">Yes</option>
              <option value="No" data-i18n="opt_no">No</option>
            </select>

            <label for="wisconsin_diet" data-i18n="label_diet">Food allergies or dietary preferences</label>
            <textarea
              id="wisconsin_diet"
              name="wisconsin_food_allergies_preferences"
              data-i18n-placeholder="ph_diet"
              placeholder="e.g., vegetarian, vegan, gluten-free, nut allergy, etc."
            ></textarea>

            <label for="wisconsin_song" data-i18n="label_song">One must-play wedding song</label>
            <input
              id="wisconsin_song"
              name="wisconsin_must_play_song"
              data-i18n-placeholder="ph_song"
              placeholder="Artist — Song title"
              autocomplete="off"
            />
          </div>

          <button type="submit" data-i18n="btn_submit">Submit RSVP</button>
        </form>

        <div class="small" data-i18n="tip_wait">
          Tip: after submitting, please wait for the confirmation message before closing this page.
        </div>
      </div>
    </div>

    <script>
      (function () {
        const I18N = {
          en: {
            page_title: "RSVP",
            heading_rsvp: "RSVP",
            subheading_date: "August 15 • Festetics Palace • Budapest, Hungary 🏰",

            section_hungary_title: "Hungary",
            section_hungary_subtitle: "Budapest • Festetics Palace • August 15",
            section_wisconsin_title: "Wisconsin",
            section_wisconsin_subtitle: "Party • Date TBD",

            label_name: "Name",
            label_email: "Email",

            label_hungary_attendance: "Will you attend the wedding in Hungary?",
            label_wisconsin_attendance: "Will you attend the Wisconsin party? (date TBD)",

            label_guests: "Number of guests",
            label_guest_names: "Guest names",
            label_hotel: "Interested in hotel accommodation?",
            label_diet: "Food allergies or dietary preferences",
            label_song: "One must-play wedding song",

            opt_select_one: "Select one…",
            opt_yes: "Yes",
            opt_maybe: "Maybe",
            opt_no: "No",

            ph_guest_names: "Please list all attending guests (including yourself), one per line.",
            ph_diet: "e.g., vegetarian, vegan, gluten-free, nut allergy, etc.",
            ph_song: "Artist — Song title",

            btn_submit: "Submit RSVP",
            tip_wait: "Tip: after submitting, please wait for the confirmation message before closing this page.",
          },
          hu: {
            page_title: "Visszajelzés (RSVP)",
            heading_rsvp: "Visszajelzés (RSVP)",
            subheading_date: "Augusztus 15. • Festetics-palota • Budapest, Magyarország 🏰",

            section_hungary_title: "Magyarország",
            section_hungary_subtitle: "Budapest • Festetics-palota • Augusztus 15.",
            section_wisconsin_title: "Wisconsin",
            section_wisconsin_subtitle: "Buli • Időpont később",

            label_name: "Név",
            label_email: "Email",

            label_hungary_attendance: "Részt veszel a magyarországi esküvőn?",
            label_wisconsin_attendance: "Részt vennél a wisconsini bulin? (időpont később)",

            label_guests: "Vendégek száma",
            label_guest_names: "Vendégek nevei",
            label_hotel: "Érdekel szálláslehetőség (hotel)?",
            label_diet: "Ételallergia vagy étkezési preferencia",
            label_song: "Kihagyhatatlan esküvői dal",

            opt_select_one: "Válasszon egyet…",
            opt_yes: "Igen",
            opt_maybe: "Talán",
            opt_no: "Nem",

            ph_guest_names: "Kérjük, sorolja fel az összes résztvevő nevét (Önt is beleértve), soronként egyet.",
            ph_diet: "pl. vegetáriánus, vegán, gluténmentes, dióallergia, stb.",
            ph_song: "Előadó — Dal címe",

            btn_submit: "RSVP beküldése",
            tip_wait: "Tipp: beküldés után várja meg a visszaigazoló üzenetet, mielőtt bezárja ezt az oldalt.",
          },
        };

        const lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
        const locale = lang.startsWith("hu") ? "hu" : "en";
        const t = (key) => (I18N[locale] && I18N[locale][key]) || I18N.en[key] || key;

        document.documentElement.lang = locale;
        document.title = t("page_title");

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = t(key);
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          el.setAttribute("placeholder", t(key));
        });
      })();
    </script>
  </body>
</html>
